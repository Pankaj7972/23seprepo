trigger:
  branches:
    include:
      - main

pool:
  name: MYAGENT 



parameters:
  - name: Environment
    displayName: Select Environment  
    type: string
    default: dev
    values:
      - dev
      - qa
      - prod    

  - name: trivy
    displayName: trivy
    type: boolean
    default: false

  - name: tfsec
    displayName: tfsec 
    type: boolean
    default: false

stages:
  - stage: VALIDATE
    displayName: VALIDATE-STAGE
    jobs:
      - job: validate
        displayName: validate-job
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'Service-Connection'
            backendAzureRmStorageAccountName: 'b18g2groupstorage'
            backendAzureRmContainerName: 'b18g2container'
            backendAzureRmKey: 'terraform.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'

  - stage: apply 
    jobs:
      - job: applyjob
        displayName: applyjob 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'Service-Connection'
            backendAzureRmStorageAccountName: 'b18g2groupstorage'
            backendAzureRmContainerName: 'b18g2container'
            backendAzureRmKey: 'terraform.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            environmentServiceNameAzureRM: 'Service-Connection'

     


