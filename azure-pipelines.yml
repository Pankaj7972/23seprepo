trigger:
  branches:
    include:
      - main

pool:
  name: AGPOOL



parameters:
  - name: Environments 
    displayName: Select Environment 
    type: string 
    default: DEV
    values:
      - DEV
      - QA 
      - PROD   

  - name: tfsec 
    displayName: TFSEC 
    type: boolean
    default: false  

  - name: validate
    displayName: VALIDATE
    type: boolean
    default: false   

  - name: apply
    displayName: APPLY
    type: boolean
    default: false 

stages:
  - stage: tfsec
    condition: ${{ eq(parameters.tfsec,true)}}
    displayName: TFSEC-STAGE 
    jobs:
      - job: tfsecjob
        displayName: TFSEC-JON 
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'tfsec .'

  - stage: terraformvalidate 
    dependsOn: 
      - tfsec
    condition: and(${{ eq(parameters.validate,true)}}, succeeded())  
    displayName: validate-job
    jobs:
      - job: validatejob
        displayName: validate-job
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'Service-Connection'
            backendAzureRmStorageAccountName: 'storageone1'
            backendAzureRmContainerName: 'containeone'
            backendAzureRmKey: 'terraform.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'

  - stage: planstage 
    dependsOn: terraformvalidate
    condition: and(${{ eq(parameters.validate,true)}},succeeded())
    displayName: PLAN-STAGE 
    jobs:
      - job: planjob
        displayName: plan-job 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'Service-Connection'
            backendAzureRmStorageAccountName: 'storageone1'
            backendAzureRmContainerName: 'containeone'
            backendAzureRmKey: 'terraform.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'Service-Connection'

  - stage: applystage 
    dependsOn: planstage
    condition: and(${{ eq(parameters.apply, true) }}, succeeded())
    displayName: APPLY-STAGE 
    jobs:
      - job: applyjob 
        displayName: apply-job 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'Service-Connection'
            backendAzureRmStorageAccountName: 'storageone1'
            backendAzureRmContainerName: 'containeone'
            backendAzureRmKey: 'terraform.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            environmentServiceNameAzureRM: 'Service-Connection'
              