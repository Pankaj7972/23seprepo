pool : 
 name: MYAGENT



stages:
  - stage: validatestage
    displayName: VALIDATESTAGE
    jobs:
      - job: validatejob
        displayName: VALIDATEJOB
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'MY-SERVICE'
            backendAzureRmStorageAccountName: 'rewalsar'
            backendAzureRmContainerName: 'koot'
            backendAzureRmKey: 'terraform1.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'

  - stage: planstage 
    displayName: PLANSTAGE
    jobs:
      - job: planjob
        displayName: PLANJOB 
        steps:

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'MY-SERVICE'
            backendAzureRmStorageAccountName: 'rewalsar'
            backendAzureRmContainerName: 'koot'
            backendAzureRmKey: 'terraform1.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'MY-SERVICE'

  - stage: manualapproval
    jobs:
      - job: approvaljob
        pool: server
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'abc'

  - stage: terraformapply 
    displayName: APPLY-STAGE
    dependsOn: manualapproval
    condition: succeeded()
    jobs:
      - job: applyjob
        displayName: APPLY-JOB 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'MY-SERVICE'
            backendAzureRmStorageAccountName: 'rewalsar'
            backendAzureRmContainerName: 'koot'
            backendAzureRmKey: 'terraform1.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'MY-SERVICE'
               
        
